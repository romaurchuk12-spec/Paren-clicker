<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Парень Clicker</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:dark;--bg:#17191f;--panel:#242832;--text:#f4f5f7;--muted:#aab0bd;--accent:#9ba8ff;--gold:#ffd166}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}main{max-width:520px;margin:auto;padding:18px 16px 32px;text-align:center}h1{font-size:27px;margin:5px 0 2px}.sub{color:var(--muted);font-size:14px;margin-bottom:18px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stat,.shop,.level{background:var(--panel);border:1px solid #343946;border-radius:16px;padding:13px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:21px}.cat-card{background:linear-gradient(145deg,#303542,#20232b);border-radius:24px;padding:18px 10px 16px;border:1px solid #414756}.cat{font-size:116px;line-height:1.25;cursor:pointer;user-select:none;transition:transform .08s}.cat:active{transform:scale(.94)}.cat-label{font-weight:800;font-size:22px}.tap-hint{font-size:13px;color:var(--muted);margin-top:4px}.float{position:fixed;pointer-events:none;font-weight:900;color:var(--gold);font-size:23px;animation:rise .7s ease-out forwards;text-shadow:0 2px 8px #000}@keyframes rise{to{transform:translateY(-70px);opacity:0}}h2{text-align:left;font-size:18px;margin:20px 0 10px}.shop{display:flex;align-items:center;gap:12px;text-align:left;margin:9px 0;padding:12px}.emoji{font-size:29px}.info{flex:1}.info strong{display:block}.info small{color:var(--muted)}button{border:0;border-radius:12px;padding:11px 13px;background:var(--accent);color:#171925;font-weight:800;font-size:14px}button:disabled{opacity:.4}.reset{margin-top:16px;background:#343946;color:var(--muted);font-weight:600}.note{color:var(--muted);font-size:12px;line-height:1.4;margin-top:14px}
</style></head><body><main><h1>🐈 Парень Clicker</h1><div class="sub">Прокачай самого важного серого кота</div><div class="stats"><div class="stat"><span>🪙 Монеты</span><strong id="coins">0</strong></div><div class="stat"><span>✨ Монет за клик</span><strong id="power">1</strong></div></div><section class="cat-card"><div class="cat" id="cat" role="button" aria-label="Погладить Парня">🐈‍⬛</div><div class="cat-label">Парень</div><div class="tap-hint">Нажимай на кота, чтобы получать монеты!</div></section><h2>🛒 Магазин улучшений</h2><div id="shop"></div><div class="level" id="level">Уровень кота: 1</div><button class="reset" id="reset">Начать заново</button><div class="note">Демо-версия. Прогресс хранится в браузере Mini App на этом устройстве.</div></main><script>
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand()}const upgrades=[{id:'snack',name:'Вкусный корм',emoji:'🥩',desc:'+1 монета за клик',base:20,add:1},{id:'toy',name:'Мышка-игрушка',emoji:'🧶',desc:'+5 монет за клик',base:120,add:5},{id:'bed',name:'Мягкая лежанка',emoji:'🛏️',desc:'+20 монет за клик',base:650,add:20},{id:'crown',name:'Королевская корона',emoji:'👑',desc:'+100 монет за клик',base:3500,add:100}];const initial=()=>({coins:0,power:1,owned:{snack:0,toy:0,bed:0,crown:0},total:0});let state;try{state=JSON.parse(localStorage.getItem('parenClickerSave'))||initial()}catch{state=initial()}function cost(u){return Math.floor(u.base*Math.pow(1.65,state.owned[u.id]||0))}function save(){localStorage.setItem('parenClickerSave',JSON.stringify(state))}function render(){document.getElementById('coins').textContent=Math.floor(state.coins).toLocaleString('ru-RU');document.getElementById('power').textContent=state.power.toLocaleString('ru-RU');document.getElementById('level').textContent='Уровень кота: '+(1+Math.floor(state.total/100));document.getElementById('shop').innerHTML=upgrades.map(u=>{const c=cost(u),owned=state.owned[u.id]||0;return `<div class="shop"><div class="emoji">${u.emoji}</div><div class="info"><strong>${u.name}</strong><small>${u.desc} · куплено: ${owned}</small><br><small>Цена: ${c.toLocaleString('ru-RU')} 🪙</small></div><button data-buy="${u.id}" ${state.coins<c?'disabled':''}>Купить</button></div>`}).join('');document.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click',()=>buy(b.dataset.buy)))}function pop(x,y,text){const el=document.createElement('div');el.className='float';el.textContent=text;el.style.left=x+'px';el.style.top=y+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),750)}document.getElementById('cat').addEventListener('click',e=>{state.coins+=state.power;state.total+=state.power;save();render();pop(e.clientX,e.clientY,'+'+state.power+' 🪙');if(tg&&tg.HapticFeedback)tg.HapticFeedback.impactOccurred('light')});function buy(id){const u=upgrades.find(x=>x.id===id),c=cost(u);if(state.coins<c)return;state.coins-=c;state.owned[id]=(state.owned[id]||0)+1;state.power+=u.add;save();render();if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('success')}document.getElementById('reset').addEventListener('click',()=>{if(confirm('Точно начать заново? Весь прогресс на этом устройстве будет сброшен.')){state=initial();save();render()}});render();
</script></body></html>
